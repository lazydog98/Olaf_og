name: Build Olaf on Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: choco install make mingw

      - name: Build Olaf
        run: |
          make
      - name: Find Olaf binary
        run: Get-ChildItem -Path . -Filter olaf_c.exe -Recurse | Select-Object -ExpandProperty FullName
  
      - name: Upload Olaf binary
        uses: actions/upload-artifact@v4
        with:
          name: olaf_windows
          path: ${{ github.workspace }}/bin/olaf_c.exe
